<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Claude Chats</h1>
      <p class="status-line">
        <span id="statsText">Loading...</span>
        <span class="status-sep">·</span>
        <span id="syncStatusContainer">
          <svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7h-4.6a6 6 0 0 0-10 2M4 17h4.6a6 6 0 0 0 10-2M20 7l-3-3M20 7l-3 3M4 17l3 3M4 17l3-3" />
          </svg>
          <svg class="warning-icon" viewBox="0 0 24 24" aria-hidden="true" style="display: none;">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <span id="syncText">Syncing...</span>
        </span>
      </p>
      <!-- IMP-05: sync quota bar -->
      <div id="quotaBar" class="quota-bar" style="display:none" title="">
        <div id="quotaFill" class="quota-fill"></div>
      </div>
    </div>
    <div class="header-actions">
      <div id="currentAccountName" class="top-account-name">Detecting...</div>

      <div class="clear-data-control">
        <button id="exportDiagBtn" class="icon-button" type="button" aria-label="Export diagnostic log" title="Export diagnostic log (cct-diag.json)" style="display:none">
          <i class="fa-solid fa-bug"></i>
        </button>
        <button id="startClearBtn" class="icon-button danger-button" type="button" aria-label="Clear tracked data" title="Clear tracked data">
          <i class="fa-solid fa-ban" style="color: rgb(181, 24, 24);"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar-row">
      <label class="search">
        <span class="sr-only">Search chats</span>
        <input id="searchInput" type="search" placeholder="Search chats" autocomplete="off">
      </label>
      <label for="accountFilterSelect" class="sr-only">Show</label>
      <select id="accountFilterSelect" class="account-select"></select>
      <button id="semanticGearBtn" class="icon-button" type="button" aria-label="Semantic search settings" title="Semantic search settings">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>

    <div class="current-line meta-row">
      <div id="searchSummary" class="search-summary"></div>
    </div>

    <!-- Phase B: Semantic Search Settings Drawer -->
    <div id="semanticDrawer" class="semantic-drawer" style="display:none">
      <div class="semantic-drawer-header">
        <div class="drawer-header-title">
          <span>Search Settings</span>
          <span id="semanticBadge" class="semantic-badge" style="display:none">⚡ Hybrid</span>
        </div>
        <button id="semanticCollapseBtn" class="icon-button semantic-collapse-btn" type="button" aria-label="Close settings" title="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Search Mode Selection (slimy-chipmunk-97) -->
      <div class="drawer-search-mode-section">
        <div class="drawer-section-title">Search Mode</div>
        <div class="radio-inputs">
          <label class="radio has-tooltip" data-tooltip="Instant offline keyword match">
            <input type="radio" name="searchMode" value="text">
            <span class="name">Text Search</span>
          </label>
          <label class="radio has-tooltip" data-tooltip="AI conceptual match (finds similar meanings)">
            <input type="radio" name="searchMode" value="semantic">
            <span class="name">Semantic Search</span>
          </label>
          <label class="radio has-tooltip" data-tooltip="Blends keyword & semantic matching">
            <input type="radio" name="searchMode" value="hybrid" checked>
            <span class="name">Hybrid (Both)</span>
          </label>
          <div class="selection-indicator"></div>
        </div>
      </div>



      <!-- Account Settings & Actions Section -->
      <div id="accountActionArea" class="drawer-account-section" style="display: none;">
        <div class="drawer-section-title">Account Management</div>
        <div class="account-actions-row">
          <div class="account-meta-info">
            <span class="account-label">Active:</span>
            <span id="drawerAccountName" class="account-value">Account Name</span>
          </div>
          <div id="accountIcons" class="account-icons">
            <button id="renameAccountBtn" class="acct-icon-btn" type="button" aria-label="Rename account" title="Rename account">
              <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              <span>Rename</span>
            </button>
            <button id="startDeleteBtn" class="acct-icon-btn" type="button" aria-label="Delete account" title="Delete account">
              <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              <span>Delete</span>
            </button>
            <div id="deleteConfirmActions" class="delete-confirm-actions" style="display: none;">
              <button id="confirmDeleteBtn" class="acct-icon-btn danger" type="button" aria-label="Confirm delete" title="Confirm delete">
                <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
                <span>Confirm</span>
              </button>
              <button id="cancelDeleteBtn" class="acct-icon-btn" type="button" aria-label="Cancel delete" title="Cancel">
                <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
                <span>Cancel</span>
              </button>
            </div>
          </div>

          <div id="inlineEditPanel" class="inline-edit-panel" style="display:none" role="dialog" aria-label="Edit account name">
            <input type="text" id="inlineEditInput" class="inline-edit-input" placeholder="Account name" autocomplete="off">
          </div>
        </div>

        <div class="drawer-section-title">Message Search Index</div>
        <div id="indexStatusContainer" class="index-status">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>

    <section id="chatList" class="chat-list" aria-live="polite"></section>
  </main>

  <script src="../shared/diag-logger.js"></script>
  <script src="../shared/shared.js"></script>
  <div id="clearConfirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-title">Clear Tracked Data</div>
      <div class="modal-body">Are you sure you want to clear all tracked Claude chats? This action cannot be undone.</div>
      <div class="modal-actions">
        <button id="cancelClearBtn" class="ghost-button">Cancel</button>
        <button id="confirmClearBtn" class="text-button danger-button" style="background: rgba(238, 124, 118, 0.15);">Confirm</button>
      </div>
    </div>
  </div>
  <script src="../dist/shared/search-storage.js"></script>
  <script src="../shared/vendor/minisearch.js"></script>
  <script src="../dist/shared/search-engine.js"></script>
  <script src="../dist/shared/embedding-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
