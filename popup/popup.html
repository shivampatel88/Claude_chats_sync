<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Chat Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Claude Chats</h1>
      <p class="status-line">
        <span id="statsText">Loading...</span>
        <span class="status-sep">·</span>
        <span id="syncStatusContainer">
          <svg class="sync-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7h-4.6a6 6 0 0 0-10 2M4 17h4.6a6 6 0 0 0 10-2M20 7l-3-3M20 7l-3 3M4 17l3 3M4 17l3-3" />
          </svg>
          <svg class="warning-icon" viewBox="0 0 24 24" aria-hidden="true" style="display: none;">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <span id="syncText">Syncing...</span>
        </span>
      </p>
      <!-- IMP-05: sync quota bar -->
      <div id="quotaBar" class="quota-bar" style="display:none" title="">
        <div id="quotaFill" class="quota-fill"></div>
      </div>
    </div>
    <div class="header-actions">
      <div id="currentAccountName" class="top-account-name">Detecting...</div>

      <div class="clear-data-control">
        <button id="startClearBtn" class="icon-button danger-button" type="button" aria-label="Clear tracked data" title="Clear tracked data">
          <i class="fa-solid fa-ban" style="color: rgb(181, 24, 24);"></i>
        </button>
      </div>
    </div>
  </header>

  <main>
    <div class="toolbar-row">
      <label class="search">
        <span class="sr-only">Search chats</span>
        <input id="searchInput" type="search" placeholder="Search chats" autocomplete="off">
      </label>
      <label for="accountFilterSelect" class="sr-only">Show</label>
      <select id="accountFilterSelect" class="account-select"></select>
    </div>

    <div class="current-line meta-row">
      <div id="searchSummary" class="search-summary"></div>
      <div id="accountActionArea" class="account-action-area" style="display: none;">
        <div id="accountIcons" class="account-icons">
          <button id="renameAccountBtn" class="acct-icon-btn" type="button" aria-label="Rename account" title="Rename account">
            <svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button id="startDeleteBtn" class="acct-icon-btn" type="button" aria-label="Delete account" title="Delete account">
            <svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
          <div id="deleteConfirmActions" class="delete-confirm-actions" style="display: none;">
            <button id="confirmDeleteBtn" class="acct-icon-btn danger" type="button" aria-label="Confirm delete" title="Confirm delete">
              <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
            </button>
            <button id="cancelDeleteBtn" class="acct-icon-btn" type="button" aria-label="Cancel delete" title="Cancel">
              <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
            </button>
          </div>
        </div>

        <div id="inlineEditPanel" class="inline-edit-panel" style="display:none" role="dialog" aria-label="Edit account name">
          <input type="text" id="inlineEditInput" class="inline-edit-input" placeholder="Account name" autocomplete="off">
        </div>
      </div>
    </div>
    <section id="chatList" class="chat-list" aria-live="polite"></section>
  </main>

  <script src="../shared/shared.js"></script>
  <div id="clearConfirmModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-title">Clear Tracked Data</div>
      <div class="modal-body">Are you sure you want to clear all tracked Claude chats? This action cannot be undone.</div>
      <div class="modal-actions">
        <button id="cancelClearBtn" class="ghost-button">Cancel</button>
        <button id="confirmClearBtn" class="text-button danger-button" style="background: rgba(238, 124, 118, 0.15);">Confirm</button>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
